name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'

permissions:
  contents: read

env:
  PACKAGE_PROJECT: 'RevitXunitAdapter/RevitXunitAdapter.csproj'
  TEST_PROJECT: 'RevitTestFramework.Common.Tests/RevitTestFramework.Common.Tests.csproj'

jobs:
  validate:
    runs-on: windows-latest
    
    strategy:
      matrix:
        revit-version: [2025, 2026, 2027]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-revit${{ matrix.revit-version }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-revit${{ matrix.revit-version }}-
          ${{ runner.os }}-nuget-
    
    - name: Restore package project
      run: dotnet restore ${{ env.PACKAGE_PROJECT }} /p:RevitVersion=${{ matrix.revit-version }}
    
    - name: Restore unit test project
      run: dotnet restore ${{ env.TEST_PROJECT }} /p:RevitVersion=${{ matrix.revit-version }}
    
    - name: Build package project
      run: dotnet build ${{ env.PACKAGE_PROJECT }} --configuration Release --no-restore /p:RevitVersion=${{ matrix.revit-version }} /p:Version=${{ matrix.revit-version }}.0.1-test
    
    - name: Run framework unit tests
      run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-restore /p:RevitVersion=${{ matrix.revit-version }} --logger "trx;LogFileName=framework-tests.trx" --results-directory TestResults-${{ matrix.revit-version }}

    - name: Create validation summary
      run: |
        Write-Host "Validated package build and framework unit tests for Revit ${{ matrix.revit-version }}."
        Write-Host "MyRevitTestsXunit and MyRevitTestsNuGet are intentionally excluded from CI."
    
    - name: Upload validation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-test-results-${{ github.event.number }}-revit-${{ matrix.revit-version }}
        path: TestResults-${{ matrix.revit-version }}/*.trx
    
    - name: Test pack (without publishing)
      run: dotnet pack ${{ env.PACKAGE_PROJECT }} --configuration Release --no-build --output test-nupkgs /p:RevitVersion=${{ matrix.revit-version }} /p:Version=${{ matrix.revit-version }}.0.1-test
    
    - name: Verify package contents
      run: |
        $revitVersion = "${{ matrix.revit-version }}"
        $packages = Get-ChildItem -Path "test-nupkgs" -Filter "*.nupkg"
        if ($packages.Count -eq 0) {
          Write-Host "? No package found for Revit $revitVersion"
          exit 1
        }
        
        foreach ($package in $packages) {
          Write-Host "? Revit $revitVersion package created successfully: $($package.Name)"
          Write-Host "?? Package size: $([math]::Round($package.Length / 1MB, 2)) MB"
        }